  # ============================================================================
  # 17. Frontend Web (Angular compilado servido en Nginx interno)
  # ============================================================================
  frontend:
    image: ${DOCKER_HUB_USER:-witmer17}/eduspace-frontend:${DOCKER_TAG:-latest}
    container_name: eduspace-frontend
    restart: unless-stopped
    networks:
      eduspace-net:
        aliases:
          - frontend
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # ============================================================================
  # 18. Proxy Inverso Caddy (Expone puertos 80/443 en el servidor Azure)
  # ============================================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: eduspace-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - eduspace-net
    depends_on:
      - frontend
      - eduspace-gateway
      - keycloak
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
