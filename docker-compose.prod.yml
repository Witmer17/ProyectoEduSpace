  tareas-ms:
    image: ${DOCKER_HUB_USER:-witmer17}/tareas-ms:${DOCKER_TAG:-latest}
    container_name: eduspace-tareas-ms
    restart: unless-stopped
    depends_on:
      - postgres
      - eduspace-eureka
      - eduspace-config
