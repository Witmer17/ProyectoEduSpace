    networks:
      eduspace-net:
        aliases:
          - asistencia-ms
    deploy:
      resources:
        limits:
          memory: 288M
        reservations:
          memory: 160M

  # ============================================================================
  # 13. Microservicio de Calificaciones (calificaciones-ms)
  # ============================================================================
  calificaciones-ms:
    image: ${DOCKER_HUB_USER:-witmer17}/calificaciones-ms:${DOCKER_TAG:-latest}
    container_name: eduspace-calificaciones-ms
    restart: unless-stopped
    depends_on:
      - postgres
      - eduspace-eureka
      - eduspace-config
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://eduspace-config:18888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_USER: ${DB_USER:-eduspace}
      DB_PASSWORD: ${DB_PASSWORD:-eduspace}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-eduspace-prod-secret-token-2026}
      JWK_SET_URI: http://eduspace-keycloak:8080/realms/eduspace/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://eduspace-keycloak:8080/realms/eduspace/protocol/openid-connect/certs
