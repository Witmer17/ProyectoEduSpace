    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://eduspace-config:18888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_USER: ${DB_USER:-eduspace}
      DB_PASSWORD: ${DB_PASSWORD:-eduspace}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-eduspace-prod-secret-token-2026}
      JWK_SET_URI: http://eduspace-keycloak:8080/realms/eduspace/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://eduspace-keycloak:8080/realms/eduspace/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY}
      MERCADOPAGO_BACK_URL: ${MERCADOPAGO_BACK_URL:-https://eduspace-peru.duckdns.org/familia/pagos}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL:-https://eduspace-peru.duckdns.org/api/v1/pagos/webhook/mercadopago}
      MERCADOPAGO_CURRENCY: PEN
      MERCADOPAGO_PRODUCCION: "true"
      JAVA_TOOL_OPTIONS: "-Xms160m -Xmx224m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    networks:
      eduspace-net:
        aliases:
          - pago-ms
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 160M

  # ============================================================================
