name: eduspace-prod

networks:
  eduspace-net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  caddy_data:
  caddy_config:

services:
  # ============================================================================
  # 1. Base de Datos Compartida (Multi-database en una sola instancia)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: eduspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduspace
      POSTGRES_USER: ${DB_USER:-eduspace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eduspace}
      TZ: America/Lima
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
      - ./deploy/postgres/dumps:/docker-entrypoint-initdb.d/dumps:ro
    networks:
      eduspace-net:
        aliases:
          - postgres
          - auth-ms-db
          - alumnos-ms-db
          - planificacion-ms-db
          - matricula-ms-db
          - asistencia-ms-db
          - calificaciones-ms-db
          - pago-ms-db
          - examenes-ms-db
          - tareas-ms-db
          - notificaciones-ms-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eduspace} -d eduspace"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================================
  # 2. Mensajería Asíncrona (Apache Kafka en modo KRaft sin ZooKeeper)
  # ============================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: eduspace-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms160m -Xmx256m -XX:+UseSerialGC"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    networks:
      eduspace-net:
        aliases:
          - kafka
          - e2e-kafka
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  # ============================================================================
  # 3. Keycloak IAM (Gestión de Identidad, Roles y Autenticación)
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: eduspace-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms192m -Xmx256m -XX:+UseSerialGC"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/eduspace-realm.json:/opt/keycloak/data/import/eduspace-realm.json:ro
    networks:
      eduspace-net:
        aliases:
          - eduspace-keycloak
          - keycloak
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================================
  # 4. Servidor de Configuración (Config Server)
  # ============================================================================
  eduspace-config:
    image: ${DOCKER_HUB_USER:-witmer17}/eduspace-config:${DOCKER_TAG:-latest}
    container_name: eduspace-config
    restart: unless-stopped
    environment:
      JWK_SET_URI: http://eduspace-keycloak:8080/realms/eduspace/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    networks:
      eduspace-net:
        aliases:
          - eduspace-config
          - config-server
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ============================================================================
  # 5. Registro y Descubrimiento de Servicios (Eureka Server)
  # ============================================================================
  eduspace-eureka:
    image: ${DOCKER_HUB_USER:-witmer17}/eduspace-eureka:${DOCKER_TAG:-latest}
    container_name: eduspace-eureka
    restart: unless-stopped
    depends_on:
      - eduspace-config
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://eduspace-config:18888
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    networks:
      eduspace-net:
        aliases:
          - eduspace-eureka
          - eureka-server
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ============================================================================
  # 6. API Gateway
  # ============================================================================
  eduspace-gateway:
    image: ${DOCKER_HUB_USER:-witmer17}/eduspace-gateway:${DOCKER_TAG:-latest}
    container_name: eduspace-gateway
    restart: unless-stopped
    depends_on:
      - eduspace-eureka
      - eduspace-config
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://eduspace-config:18888
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWK_SET_URI: http://eduspace-keycloak:8080/realms/eduspace/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    networks:
      eduspace-net:
        aliases:
          - eduspace-gateway
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 160M

  # ============================================================================
  # 7. Microservicio de Autenticación (auth-ms)
  # ============================================================================
  auth-ms:
    image: ${DOCKER_HUB_USER:-witmer17}/auth-ms:${DOCKER_TAG:-latest}
    container_name: eduspace-auth-ms
    restart: unless-stopped
    depends_on:
      - postgres
      - eduspace-eureka
      - eduspace-config
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://eduspace-config:18888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_USER: ${DB_USER:-eduspace}
      DB_PASSWORD: ${DB_PASSWORD:-eduspace}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-eduspace-prod-secret-token-2026}
      APP_AUTH_JWT_GENERAR_CLAVE_SI_FALTA: "true"
      APP_AUTH_KEYCLOAK_ADMIN_ACEPTAR_TOKENS: "true"
      APP_AUTH_KEYCLOAK_ADMIN_BASE_URL: "http://eduspace-keycloak:8080"
      APP_AUTH_KEYCLOAK_ADMIN_REALM: "eduspace"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    networks:
      eduspace-net:
        aliases:
          - auth-ms
    deploy:
      resources:
        limits:
          memory: 288M
        reservations:
          memory: 160M

  # ============================================================================
  # 8. Microservicio de Planificación Académica (planificacion-ms)
  # ============================================================================
  planificacion-ms:
    image: ${DOCKER_HUB_USER:-witmer17}/planificacion-ms:${DOCKER_TAG:-latest}
    container_name: eduspace-planificacion-ms
    restart: unless-stopped
