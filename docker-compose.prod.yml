        reservations:
          memory: 160M

  # ============================================================================
  # 11. Microservicio de Pagos y Caja (pago-ms con Mercado Pago)
  # ============================================================================
  pago-ms:
    image: ${DOCKER_HUB_USER:-witmer17}/pago-ms:${DOCKER_TAG:-latest}
    container_name: eduspace-pago-ms
    restart: unless-stopped
